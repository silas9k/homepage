name: silas-homepage
services:
  homepage:
    image: ${HOMEPAGE_IMAGE:-silas-homepage:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ${HOMEPAGE_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-home.silasnet.win,debian-docker.tail277de6.ts.net,localhost:3000,127.0.0.1:3000}
      HOMEPAGE_AUTH_ORIGINS: ${HOMEPAGE_AUTH_ORIGINS:-https://home.silasnet.win,https://debian-docker.tail277de6.ts.net}
      TZ: ${TZ:-Europe/Berlin}
      LOG_TARGETS: stdout
      NEXT_TELEMETRY_DISABLED: "1"
      HOMEPAGE_AUTH_DB: /app/data/auth/auth.sqlite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${HOMEPAGE_CONFIG_PATH:-./config}:/app/config:ro
      - homepage-auth:/app/data/auth
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 200
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  homepage-auth:
