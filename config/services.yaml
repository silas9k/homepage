          optional: true
- Verwaltung & Netzwerk:
    - Portainer:
        icon: /silas/icons/portainer.svg
        description: Docker-Verwaltung
        href: "{{HOMEPAGE_VAR_PORTAINER_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_PORTAINER_HEALTH_URL}}"
        silas:
          metrics:
            - Aktiv
            - Gestoppt
            - Gesamt
          site: a
          host: debian-docker
        widget:
          type: portainer
          url: "{{HOMEPAGE_VAR_PORTAINER_URL}}"
          env: "{{HOMEPAGE_VAR_PORTAINER_ENV}}"
          key: "{{HOMEPAGE_VAR_PORTAINER_TOKEN}}"
          fields:
            - running
            - stopped
            - total
          silasRequired:
            - url
            - env
            - key
    - Tailscale:
        icon: /silas/icons/tailscale.svg
        description: Privates Netzwerk
        href: https://login.tailscale.com/admin/machines
        silas:
          metrics:
            - Zuletzt gesehen
            - Schlüsselablauf
        widget:
          type: tailscale
          deviceid: "{{HOMEPAGE_VAR_TAILSCALE_DEVICE_ID}}"
          key: "{{HOMEPAGE_VAR_TAILSCALE_TOKEN}}"
          fields:
            - last_seen
            - expires
          silasRequired:
            - deviceid
            - key
    - Cloudflare Tunnel:
        icon: /silas/icons/cloudflare.svg
        description: Remote-Zugriff
        href: https://one.dash.cloudflare.com/
        silas:
          metrics:
            - Tunnel-Status
        widget:
          type: cloudflared
          accountid: "{{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}"
          tunnelid: "{{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}}"
          key: "{{HOMEPAGE_VAR_CLOUDFLARE_TOKEN}}"
          fields:
            - status
          silasRequired:
            - accountid
            - tunnelid
            - key
- Backups:
    - Resticwatch:
        icon: /silas/icons/backup.svg
        description: Backup-Monitoring
        href: "{{HOMEPAGE_VAR_RESTICWATCH_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_RESTICWATCH_HEALTH_URL}}"
        silas:
          note: Optional · nicht konfiguriert
    - Backup-HDD · Raspberry Pi:
        icon: /silas/icons/backup.svg
        description: Backupziel · geplant
        href: "{{HOMEPAGE_VAR_BACKUP_HDD_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_BACKUP_HDD_HEALTH_URL}}"
        silas:
          site: b
          host: Raspberry Pi 5
          note: Geplant · noch keine Backup-Daten
