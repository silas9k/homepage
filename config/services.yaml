        href: "{{HOMEPAGE_VAR_HOMEASSISTANT_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_HOMEASSISTANT_HEALTH_URL}}"
        silas:
          metrics:
            - Lichter an
            - Schalter an
        widget:
          type: homeassistant
          url: "{{HOMEPAGE_VAR_HOMEASSISTANT_API_URL}}"
          key: "{{HOMEPAGE_VAR_HOMEASSISTANT_TOKEN}}"
          fields:
            - lights_on
            - switches_on
          silasRequired:
