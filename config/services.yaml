        widget:
          type: homebridge
          url: "{{HOMEPAGE_VAR_HOMEBRIDGE_A_API_URL}}"
          username: "{{HOMEPAGE_VAR_HOMEBRIDGE_A_USER}}"
          password: "{{HOMEPAGE_VAR_HOMEBRIDGE_A_PASSWORD}}"
          fields:
            - updates
            - child_bridges
          silasRequired:
