- Server:
    - Proxmox:
        icon: /silas/icons/proxmox.svg
        description: ThinkCentre M920q · Virtualisierung
        href: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
        silas:
          sshUrl: "{{HOMEPAGE_VAR_PROXMOX_SSH_URL}}"
          metrics:
            - CPU
            - RAM
            - VMs
            - LXC
          site: a
          host: ThinkCentre M920q
        widget:
          type: proxmox
          url: "{{HOMEPAGE_VAR_PROXMOX_URL}}"
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          node: "{{HOMEPAGE_VAR_PROXMOX_NODE}}"
          silasRequired:
            - url
            - username
            - password
            - node
          fields:
            - resources.cpu
            - resources.mem
            - vms
            - lxc
    - debian-docker:
        icon: /silas/icons/debian.svg
        description: Debian 13 · Docker Host
        href: "{{HOMEPAGE_VAR_DEBIAN_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_DEBIAN_HEALTH_URL}}"
        silas:
          sshUrl: "{{HOMEPAGE_VAR_DEBIAN_SSH_URL}}"
          metrics:
            - CPU
            - RAM
            - Disk
          site: a
          host: debian-docker
        widget:
          type: glances
          url: "{{HOMEPAGE_VAR_DEBIAN_GLANCES_URL}}"
          username: "{{HOMEPAGE_VAR_DEBIAN_GLANCES_USER}}"
          password: "{{HOMEPAGE_VAR_DEBIAN_GLANCES_PASSWORD}}"
          version: 4
          metric: summary:/
          refreshInterval: 60000
          silasRequired:
            - url
    - raspi:
        icon: /silas/icons/raspberry-pi.svg
        description: Raspberry Pi 5 · Homebridge & Backups
        href: "{{HOMEPAGE_VAR_RASPI_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_RASPI_HEALTH_URL}}"
        silas:
          sshUrl: "{{HOMEPAGE_VAR_RASPI_SSH_URL}}"
          metrics:
            - CPU
            - RAM
            - Disk
          site: b
          host: Raspberry Pi 5
        widget:
          type: glances
          url: "{{HOMEPAGE_VAR_RASPI_GLANCES_URL}}"
          username: "{{HOMEPAGE_VAR_RASPI_GLANCES_USER}}"
          password: "{{HOMEPAGE_VAR_RASPI_GLANCES_PASSWORD}}"
          version: 4
          metric: summary:/
          refreshInterval: 60000
          silasRequired:
            - url
- Cloud & Dokumente:
    - Nextcloud:
        icon: /silas/icons/nextcloud.svg
        description: Dateien, Kalender und Kontakte
        href: "{{HOMEPAGE_VAR_NEXTCLOUD_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_NEXTCLOUD_HEALTH_URL}}"
        silas:
          metrics:
            - Freier Speicher
            - Aktive Nutzer
            - Dateien
          site: a
          host: debian-docker
        widget:
          type: nextcloud
          url: "{{HOMEPAGE_VAR_NEXTCLOUD_URL}}"
          key: "{{HOMEPAGE_VAR_NEXTCLOUD_TOKEN}}"
          fields:
            - freespace
            - activeusers
            - numfiles
          silasRequired:
            - url
            - key
    - Memos:
        icon: /silas/icons/memos.svg
        description: Notizen und Gedanken
        href: "{{HOMEPAGE_VAR_MEMOS_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_MEMOS_HEALTH_URL}}"
        silas:
          site: a
          host: debian-docker
    - Vaultwarden:
        icon: /silas/icons/vaultwarden.svg
        description: Passwort-Manager
        href: "{{HOMEPAGE_VAR_VAULTWARDEN_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_VAULTWARDEN_HEALTH_URL}}"
        silas:
          site: a
          host: debian-docker
    - Palmr:
        icon: /silas/icons/palmr.svg
        description: Sicherer Dateitransfer
        href: "{{HOMEPAGE_VAR_PALMR_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_PALMR_HEALTH_URL}}"
        silas:
          site: a
          host: debian-docker
          note: Optional · archivierte Beta prüfen
    - Paperless-ngx:
        icon: /silas/icons/paperless-ngx.svg
        description: Dokumente und digitales Archiv
        href: "{{HOMEPAGE_VAR_PAPERLESS_URL}}"
        silas:
          optional: true
          metrics:
            - Dokumente
            - Eingang
        widget:
          type: paperlessngx
          url: "{{HOMEPAGE_VAR_PAPERLESS_URL}}"
          key: "{{HOMEPAGE_VAR_PAPERLESS_TOKEN}}"
          fields:
            - documents
            - inbox
          silasRequired:
            - url
            - key
- Fotos & Medien:
    - Immich:
        icon: /silas/icons/immich.svg
        description: Fotos und Videos
        href: "{{HOMEPAGE_VAR_IMMICH_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_IMMICH_HEALTH_URL}}"
        silas:
          site: a
          host: debian-docker
          metrics:
            - Fotos
            - Videos
            - Speicher
            - Nutzer
        widget:
          type: immich
          url: "{{HOMEPAGE_VAR_IMMICH_API_URL}}"
          key: "{{HOMEPAGE_VAR_IMMICH_TOKEN}}"
          version: 2
          fields:
            - photos
            - videos
            - storage
            - users
          silasRequired:
            - url
            - key
    - Jellyfin:
        icon: /silas/icons/jellyfin.svg
        description: Filme und Serien
        href: "{{HOMEPAGE_VAR_JELLYFIN_URL}}"
        siteMonitor: "{{HOMEPAGE_VAR_JELLYFIN_HEALTH_URL}}"
        silas:
          metrics:
            - Filme
            - Serien
            - Episoden
          site: a
          host: debian-docker
        widget:
          type: jellyfin
          url: "{{HOMEPAGE_VAR_JELLYFIN_URL}}"
          key: "{{HOMEPAGE_VAR_JELLYFIN_TOKEN}}"
          version: "{{HOMEPAGE_VAR_JELLYFIN_WIDGET_VERSION}}"
          enableBlocks: true
          enableNowPlaying: false
          enableUser: false
          enableMediaControl: false
          fields:
            - movies
            - series
            - episodes
          silasRequired:
            - url
            - key
            - version
- Smart Home:
    - Home Assistant:
        icon: /silas/icons/home-assistant.svg
