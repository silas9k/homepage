        silas:
          metrics:
            - Updates
            - Bridges
          site: b
          host: Raspberry Pi 5
        widget:
          type: homebridge
          url: "{{HOMEPAGE_VAR_HOMEBRIDGE_B_API_URL}}"
          username: "{{HOMEPAGE_VAR_HOMEBRIDGE_B_USER}}"
          password: "{{HOMEPAGE_VAR_HOMEBRIDGE_B_PASSWORD}}"
          fields:
            - updates
            - child_bridges
          silasRequired:
            - url
            - username
            - password
